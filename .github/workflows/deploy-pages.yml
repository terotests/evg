# Deploy the EVG documentation to GitHub Pages.
#
#   https://terotests.github.io/evg/
#
# Same engine as https://terotests.github.io/Ranger/docs/ (Astro + Starlight).
#
# REQUIRED repo setting (Settings → Pages → Build and deployment → Source):
#   GitHub Actions
# If Source is still "Deploy from a branch", GitHub also runs the automatic
# Jekyll pages-build-deployment job. That pass reads docs/site/**/*.md `---`
# blocks as YAML and fails. Switch Source to GitHub Actions so only this
# workflow deploys.
name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: docs/site/package-lock.json

      - name: Install documentation dependencies
        working-directory: docs/site
        run: npm ci

      - name: Build the documentation site
        working-directory: docs/site
        run: npm run build
        env:
          EVG_COMMIT: ${{ github.sha }}
          ASTRO_TELEMETRY_DISABLED: "1"

      - name: Assemble the Pages artifact
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_site"
          cp -r docs/site/dist/. "$GITHUB_WORKSPACE/_site/"
          touch "$GITHUB_WORKSPACE/_site/.nojekyll"
          test -s "$GITHUB_WORKSPACE/_site/index.html"
          test -s "$GITHUB_WORKSPACE/_site/css/properties/index.html"
          test -s "$GITHUB_WORKSPACE/_site/effects/shaders/index.html"
          grep -q "EVG" "$GITHUB_WORKSPACE/_site/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
