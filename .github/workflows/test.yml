name: Unit Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

# The historically required checks from this workflow are `Run Unit Tests
# (20.x)` and `Run Unit Tests (22.x)`. They `needs` Storm so a red engine
# suite cannot leave those checks green (skipped required checks block merge).
# Job name is not `Storm engine (Ranger)` — that name lives on the CI
# workflow's gate so GitHub does not collapse two checks into one context.
jobs:
  storm:
    name: storm-engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Checkout Ranger compiler
        uses: actions/checkout@v4
        with:
          repository: terotests/Ranger
          ref: master
          path: ranger-compiler
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Storm engine tests
        run: npm run storm:test
        env:
          RANGER_ROOT: ${{ github.workspace }}/ranger-compiler
          REQUIRE_RANGER: "1"

  test:
    name: Run Unit Tests
    needs: [storm]
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check for vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript compilation
        run: npx tsc --noEmit
        continue-on-error: true

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    if: github.event_name == "pull_request"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage
        continue-on-error: true

      - name: Comment coverage on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const coverage = '✅ Tests completed. Check the logs for coverage details.';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: coverage
            });
        continue-on-error: true
