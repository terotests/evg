name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Storm is the Ranger-compiled EVG engine suite. The Thunderstruck vitest
# job used to be able to go green while Storm was red (or skipped), which is
# how a required check named `test` would not protect master. Storm therefore
# runs first; `test` and `test-gate` both fail closed if it does not pass.
jobs:
  storm:
    name: Storm engine (Ranger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Checkout Ranger compiler
        uses: actions/checkout@v4
        with:
          repository: terotests/Ranger
          ref: master
          path: ranger-compiler
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Storm engine tests
        run: npm run storm:test
        env:
          RANGER_ROOT: ${{ github.workspace }}/ranger-compiler
          REQUIRE_RANGER: "1"

  test:
    needs: [storm]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # Stable required-check name for branch protection. Prefer this over
  # matrix-specific names like `Run Unit Tests (20.x)` or a bare `test`.
  test-gate:
    name: test-gate
    runs-on: ubuntu-latest
    needs: [test, storm]
    if: always()
    steps:
      - name: Require Storm engine and unit tests
        run: |
          if [ "${{ needs.storm.result }}" != "success" ]; then
            echo "Storm engine (Ranger) failed, was skipped, or was cancelled"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Unit tests / build failed, were skipped, or were cancelled"
            exit 1
          fi
          echo "test-gate passed"
